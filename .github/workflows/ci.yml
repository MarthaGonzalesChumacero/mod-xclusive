name: CI - MOD XCLUSIVE

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend - Build y Lint
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Ejecutar Lint
        working-directory: frontend
        run: npm run lint

      - name: Compilar Frontend
        working-directory: frontend
        run: npm run build

  gateway:
    name: API Gateway
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - name: Instalar dependencias
        working-directory: gateway
        run: npm ci

      - name: Verificar sintaxis
        working-directory: gateway
        run: node --check src/index.js

  usuarios:
    name: Microservicio Usuarios
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ms-usuarios/package-lock.json

      - name: Instalar dependencias
        working-directory: ms-usuarios
        run: npm ci

      - name: Verificar sintaxis
        working-directory: ms-usuarios
        run: node --check src/index.js

  productos:
    name: Microservicio Productos
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ms-productos/package-lock.json

      - name: Instalar dependencias
        working-directory: ms-productos
        run: npm ci

      - name: Verificar sintaxis
        working-directory: ms-productos
        run: node --check src/index.js

  pedidos:
    name: Microservicio Pedidos
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ms-pedidos/package-lock.json

      - name: Instalar dependencias
        working-directory: ms-pedidos
        run: npm ci

      - name: Verificar sintaxis
        working-directory: ms-pedidos
        run: node --check src/index.js